name: Release image

# Publishes a ready-to-run image once a version tag passes CI, so the deployment
# host never has to build one (a small VPS cannot reliably run the Turbopack
# build). The chain is:
#
#   push a `v*` tag  ->  ci.yml runs the full gate set on that commit (it is
#   triggered by tags as well as by main)  ->  this workflow starts when that CI
#   run completes and continues only if it passed for a `v*` ref
#
# Ordinary main pushes and pull requests run CI and stop there; they never build
# an image. `workflow_dispatch` bypasses the CI gate on purpose, for rebuilding
# a release by hand.
#
# This workflow does not verify anything itself: CI is the single gate, and
# nothing here runs when it is red.
#
# `workflow_run` fires for every ci.yml completion, so the job filters on
#
#   github.event.workflow_run.head_branch    the tag name, e.g. v0.1.0
#
# A tag push sets `head_branch` to the tag name, which is the only ref signal
# the run object carries: it has no `ref` and no `ref_type`, and a filter
# written against a missing property matches nothing — the build is skipped
# with no failure anywhere. Because `head_branch` is a bare name, "Resolve the
# tag" then proves the tag exists, so a branch that merely starts with `v`
# cannot start a release.
#
# A bare `git push origin v0.1.0` is enough: the release is created here if it
# does not exist yet. Publishing the release in the UI first works too, and the
# assets are attached to it either way.
#
# Each release carries four files under stable names, which is what lets the
# deploy script use the plain `releases/latest/download/<name>` URL without any
# API call:
#
#   pioneer-wiki-linux-amd64.tar.gz   the image in `docker save` format
#   docker-compose.yml                the run file, taken from the repository
#   DEPLOY.txt                        the manual steps, from deploy/DEPLOY.txt
#   default.env.example               template the first deploy copies to .env
#
# The archive carries two tags — pioneer-wiki:latest and pioneer-wiki:<tag> — so
# the previous release stays on disk for a rollback.
#
# Both this file and ci.yml must be on the default branch: a `workflow_run` event
# only triggers workflows that exist there.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: read

# Releases are serialised and never cancelled halfway through publishing.
concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # create the release and attach the assets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Resolve the tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          TAG="${TAG#refs/tags/}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::'$TAG' is not a v* tag"; exit 1 ;;
          esac
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null \
            || { echo "::error::refs/tags/$TAG does not exist"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG}"

      # The exact commit CI validated, not a branch head that may have moved on.
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.meta.outputs.tag || github.event.workflow_run.head_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `load` brings the result into the local daemon so it can be saved to a
      # file below; the GHA cache keeps pnpm install --frozen-lockfile and the Turbopack build from
      # starting cold on every release.
      - name: Build the runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: |
            pioneer-wiki:latest
            pioneer-wiki:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Pioneer Wiki
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The HEALTHCHECK only asks for /icon.svg, which comes from public/ and
      # answers even when the build output was never packaged — that is how a
      # release shipped without .next/static and looked healthy. Run the image and
      # request an asset the rendered page actually asks for, before anything is
      # published. PIONEER_DATA_SOURCE=mock so the page renders without Supabase.
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e PIONEER_DATA_SOURCE=mock pioneer-wiki:latest
          READY=""
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/icon.svg; then READY=1; break; fi
            sleep 2
          done
          [ -n "$READY" ] || { echo "::error::the image never answered on port 3000"; exit 1; }

          ASSET="$(curl -fsS http://127.0.0.1:3000/ | grep -o '/_next/static/[^"]*\.js' | head -n 1 || true)"
          [ -n "$ASSET" ] || { echo "::error::the rendered page references no /_next/static script"; exit 1; }
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$ASSET")"
          echo "GET $ASSET -> $CODE"
          [ "$CODE" = 200 ] || { echo "::error::$ASSET returned $CODE — the image is missing .next/static"; exit 1; }

      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f smoke

      - name: Package the image for download
        run: |
          docker save pioneer-wiki:latest "pioneer-wiki:${{ steps.meta.outputs.tag }}" | gzip -6 > pioneer-wiki-linux-amd64.tar.gz
          ls -lh pioneer-wiki-linux-amd64.tar.gz

      # Publishing is the last step, so a failure anywhere above leaves the
      # release untouched instead of half-populated.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          cp deploy/DEPLOY.txt DEPLOY.txt
          cp .env.example default.env.example
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; attaching the assets to it"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" \
            pioneer-wiki-linux-amd64.tar.gz docker-compose.yml DEPLOY.txt \
            default.env.example \
            --clobber
